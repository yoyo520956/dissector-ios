name: Dissector
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Dissector:
    type: application
    platform: iOS
    sources:
      - path: Diss
      - path: Resources
    info:
      path: Diss/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: "IPA 安装包"
            LSHandlerRank: "Alternate"
            LSItemContentTypes: ["public.data"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.dissector
        INFOPLIST_KEY_CFBundleDisplayName: "拆解者"
        INFOPLIST_KEY_CFBundleName: "Dissector"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "20261020.05"
        MARKETING_VERSION: "1.3.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        SWIFT_COMPILATION_MODE: singlefile
schemes:
  Dissector:
    build:
      targets:
        Dissector: all
    run:
      config: Debug
